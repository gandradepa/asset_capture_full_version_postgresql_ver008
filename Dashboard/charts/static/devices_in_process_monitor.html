<!DOCTYPE html>
<html>
<head>

  <style>
    #vis.vega-embed {

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@6"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@7"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-57adfe654335f7b11e6bde48624ca1d0"}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "Workflow", "legend": null, "sort": ["New", "Assigned", "In Progress", "Pending", "Complete"], "type": "nominal"}, "tooltip": [{"field": "Workflow", "title": "Stage", "type": "nominal"}, {"field": "Device_QTY", "title": "Device Count", "type": "quantitative"}, {"field": "Average_Days", "format": ".1f", "title": "Avg Days in Stage", "type": "quantitative"}], "x": {"field": "Device_QTY", "stack": "center", "title": "Number of Devices", "type": "quantitative"}, "y": {"field": "Workflow", "sort": ["New", "Assigned", "In Progress", "Pending", "Complete"], "title": "Workflow Stage", "type": "nominal"}}, "height": 300, "title": "Devices in Process - Monitor", "width": 500, "$schema": "https://vega.github.io/schema/vega-lite/v6.1.0.json", "datasets": {"data-57adfe654335f7b11e6bde48624ca1d0": [{"Workflow": "Asset Management", "Device_QTY": 3, "Average_Days": 1.0}, {"Workflow": "Completed", "Device_QTY": 2, "Average_Days": 1.0}, {"Workflow": "Eletrical Team", "Device_QTY": 11, "Average_Days": 1.0}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block title %}UBC Asset Capture{% endblock %}</title>
  
  <!-- Tailwind CSS (kept for backwards compatibility) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Mobile-First Custom Styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  
  <link rel="icon" href="{{ url_for('static', filename='logos/ubc-facilities_logo.jpg') }}" type="image/jpeg">
  
  <style>
    /* Additional mobile optimizations */
    body { 
      background-color: #f8fafc;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    
    /* Header optimizations for mobile */
    header .logo-img {
      height: 40px;
      width: auto;
    }
    
    @media (min-width: 640px) {
      header .logo-img {
        height: 50px;
      }
    }
  </style>
</head>
<body class="text-gray-800">

  <header class="bg-white shadow-sm sticky top-0 z-10" style="padding-top: env(safe-area-inset-top, 0);">
    <div class="container mx-auto px-4">
      <div class="flex justify-between items-center py-3">
        <div class="flex items-center gap-2">
          <img src="{{ url_for('static', filename='logos/ubc-facilities_logo.jpg') }}" 
               alt="UBC Facilities Logo" 
               class="logo-img">
          <h1 class="hidden sm:block text-base sm:text-lg font-semibold text-gray-800">Asset Capture</h1>
        </div>

        <div class="flex items-center gap-2 sm:gap-4">
          {% block header_right_extra %}{% endblock %}

          {% if current_user.is_authenticated %}
          <div class="flex items-center gap-2 sm:gap-4 text-xs sm:text-sm">
            <span class="hidden sm:inline text-gray-600">Welcome, <strong>{{ username or 'User' }}</strong>!</span>
            <a href="{{ url_for('auth.change_password') }}" 
               class="text-blue-600 hover:underline whitespace-nowrap" 
               title="Change Password">Change Password</a>
            <a href="{{ url_for('auth.logout') }}" 
               class="btn-secondary text-white py-1.5 px-2 sm:px-3 rounded text-xs sm:text-sm font-semibold"
               style="min-height: 36px;">Logout</a>
          </div>
          {% endif %}
        </div>

      </div>
    </div>
  </header>
  
  <main class="container mx-auto px-4 py-6 sm:py-8">
    <div class="max-w-2xl mx-auto">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
